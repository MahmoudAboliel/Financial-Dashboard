services:
  - type: web
    name: my-flask-backend  # اختر اسماً لخدمتك
    runtime: python
    repo: https://github.com/MahmoudAboliel/Financial-Dashboard.git # رابط المستودع
    rootDir: backend        # <-- هذا هو السطر السحري الذي يحدد مجلد الباك إند
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py  # أو الأمر الذي تستخدمه لتشغيل Flask
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.9  # حدد إصدار بايثون الذي تستخدمه
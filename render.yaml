services:
  - type: web
    name: fullstack-economics-backend
    runtime: python
    repo: https://github.com/MahmoudAboliel/Financial-Dashboard.git
    rootDir: backend  # لأن مشروعك في مجلد backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app  # استخدم Gunicorn للإنتاج (يعمل على Linux)
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///instance/app.db  # مؤقتاً، الأفضل استخدام PostgreSQL
    # تحسينات إضافية
    healthCheckPath: /  # مسار فحص الصحة (اختياري)
    autoDeploy: true    # النشر التلقائي عند الدفع إلى GitHub